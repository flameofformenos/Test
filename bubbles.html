<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Zayn's Bubble Pop!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      position: fixed;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      background: #3c6b96;
    }
    canvas { display: block; position: fixed; top: 0; left: 0; }
    #score {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      width: 100%;
      text-align: center;
      color: #ffffff;
      font-size: 3rem;
      font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', Arial, sans-serif;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 2px 0 rgba(30,110,170,0.55), 0 4px 14px rgba(30,110,170,0.45);
      transition: transform 0.09s ease-out;
      z-index: 2;
    }
    #cheer {
      position: fixed;
      top: 42%;
      width: 100%;
      text-align: center;
      font-size: 2.4rem;
      font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', Arial, sans-serif;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      color: #fff;
      text-shadow: 0 2px 0 rgba(220,90,140,0.7), 0 6px 18px rgba(220,90,140,0.55);
      transform: scale(0.6);
      transition: opacity 0.25s, transform 0.25s;
      z-index: 2;
    }
    #cheer.show { opacity: 1; transform: scale(1); }
    #hint {
      position: fixed;
      bottom: max(34px, env(safe-area-inset-bottom));
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.95);
      font-size: 1.5rem;
      font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', Arial, sans-serif;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(30,110,170,0.6);
      animation: pulse 2.2s infinite;
      transition: opacity 0.5s;
      z-index: 2;
    }
    @keyframes pulse {
      0%,100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="score">🫧 0</div>
  <div id="cheer"></div>
  <div id="hint">👆 Pop the bubbles, Zayn!</div>

  <script>
    'use strict';
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const cheerEl = document.getElementById('cheer');
    const hintEl = document.getElementById('hint');

    let W = 0, H = 0, dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 250));
    resize();

    /* ================================================================
       AUDIO — built for iPhone / iOS Safari.
       - AudioContext is created + resumed inside the first real touch.
       - A silent buffer is played inside that same gesture to unlock.
       - navigator.audioSession.type = 'playback' makes sound play even
         when the iPhone hardware silent/mute switch is ON.
       - Context is re-resumed on every tap and on visibility changes,
         because iOS suspends it after interruptions (calls, Siri, etc).
       ================================================================ */
    let audioCtx = null;
    let masterOut = null;
    let noiseBuf = null;
    let unlocked = false;

    function setPlaybackSession() {
      try {
        if (navigator.audioSession) navigator.audioSession.type = 'playback';
      } catch (e) {}
    }
    setPlaybackSession();

    function initAudio() {
      setPlaybackSession();
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();

        // master chain: gain -> gentle compressor -> speakers,
        // so rapid multi-finger popping stays loud but clean
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.knee.value = 20;
        comp.ratio.value = 6;
        comp.attack.value = 0.002;
        comp.release.value = 0.12;
        masterOut = audioCtx.createGain();
        masterOut.gain.value = 0.9;
        masterOut.connect(comp);
        comp.connect(audioCtx.destination);

        // shared noise buffer for the pop texture
        const len = Math.floor(audioCtx.sampleRate * 0.25);
        noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

        audioCtx.onstatechange = () => {
          if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
            audioCtx.resume().catch(() => {});
          }
        };
      }
      if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
      if (!unlocked && audioCtx) {
        // play a silent tick inside the user gesture — the classic iOS unlock
        try {
          const buf = audioCtx.createBuffer(1, 1, 22050);
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(audioCtx.destination);
          src.start(0);
          unlocked = true;
        } catch (e) {}
      }
    }
    ['pointerdown', 'touchstart', 'touchend', 'mousedown', 'keydown'].forEach(ev =>
      window.addEventListener(ev, initAudio, { capture: true, passive: true }));
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && audioCtx && audioCtx.state !== 'running') {
        audioCtx.resume().catch(() => {});
      }
    });

    // The pop: a deep, rounded "bubble wrap" thunk.
    // 1) low sine thump that drops fast in pitch (the body of the pop)
    // 2) short band-passed noise knock around 300-500 Hz (the skin snapping)
    // 3) the tiniest high tick for tactility — quiet, so it never gets tinny
    function playPop(radius) {
      if (!audioCtx || !masterOut) return;
      if (audioCtx.state !== 'running') { audioCtx.resume().catch(() => {}); }
      try {
        const ac = audioCtx;
        const now = ac.currentTime;
        const rnd = (Math.random() - 0.5);

        // bigger bubble -> deeper pop
        const f0 = Math.max(140, 300 - radius * 1.7) * (1 + rnd * 0.12);

        // 1) low thump
        const osc = ac.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f0, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(52, f0 * 0.3), now + 0.07);
        const og = ac.createGain();
        og.gain.setValueAtTime(1.0, now);
        og.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        osc.connect(og);
        og.connect(masterOut);
        osc.start(now);
        osc.stop(now + 0.2);

        // 2) mid knock (noise through bandpass)
        const knock = ac.createBufferSource();
        knock.buffer = noiseBuf;
        const bp = ac.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 340 + rnd * 120 + Math.max(0, 60 - radius);
        bp.Q.value = 1.1;
        const kg = ac.createGain();
        kg.gain.setValueAtTime(0.85, now);
        kg.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        knock.connect(bp);
        bp.connect(kg);
        kg.connect(masterOut);
        knock.start(now);
        knock.stop(now + 0.1);

        // 3) tiny tactile tick
        const tick = ac.createBufferSource();
        tick.buffer = noiseBuf;
        const hp = ac.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 2600;
        const tg = ac.createGain();
        tg.gain.setValueAtTime(0.10, now);
        tg.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
        tick.connect(hp);
        hp.connect(tg);
        tg.connect(masterOut);
        tick.start(now);
        tick.stop(now + 0.03);
      } catch (e) {}
    }

    // happy little voices for freed animals, played just after the pop
    function playAnimalSound(kind) {
      if (!audioCtx || !masterOut) return;
      try {
        const ac = audioCtx;
        const sweep = (type, f1, f2, t, dur, vol, lpf) => {
          const o = ac.createOscillator();
          o.type = type;
          o.frequency.setValueAtTime(f1, t);
          o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.8);
          const gn = ac.createGain();
          gn.gain.setValueAtTime(0.0001, t);
          gn.gain.linearRampToValueAtTime(vol, t + 0.015);
          gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
          let node = o;
          if (lpf) {
            const f = ac.createBiquadFilter();
            f.type = 'lowpass';
            f.frequency.value = lpf;
            o.connect(f);
            node = f;
          }
          node.connect(gn);
          gn.connect(masterOut);
          o.start(t);
          o.stop(t + dur + 0.02);
        };
        const t0 = ac.currentTime + 0.09;
        if (kind === 'chirp') {
          sweep('sine', 1500, 2100, t0, 0.08, 0.15);
          sweep('sine', 1700, 2300, t0 + 0.11, 0.08, 0.13);
        } else if (kind === 'quack') {
          sweep('sawtooth', 300, 190, t0, 0.13, 0.16, 1100);
          sweep('sawtooth', 280, 175, t0 + 0.16, 0.11, 0.13, 1100);
        } else if (kind === 'blub') {
          sweep('sine', 560, 260, t0, 0.09, 0.17);
          sweep('sine', 430, 200, t0 + 0.12, 0.09, 0.14);
        } else if (kind === 'boing') {
          const o = ac.createOscillator();
          o.type = 'triangle';
          o.frequency.setValueAtTime(150, t0);
          o.frequency.exponentialRampToValueAtTime(430, t0 + 0.09);
          o.frequency.exponentialRampToValueAtTime(230, t0 + 0.22);
          const gn = ac.createGain();
          gn.gain.setValueAtTime(0.0001, t0);
          gn.gain.linearRampToValueAtTime(0.2, t0 + 0.02);
          gn.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
          o.connect(gn);
          gn.connect(masterOut);
          o.start(t0);
          o.stop(t0 + 0.32);
        }
      } catch (e) {}
    }

    // little ascending chime for milestone celebrations
    function playCheer() {
      if (!audioCtx || !masterOut) return;
      try {
        const ac = audioCtx;
        const notes = [523.25, 659.25, 783.99]; // C5 E5 G5
        notes.forEach((f, i) => {
          const t = ac.currentTime + i * 0.11;
          const o = ac.createOscillator();
          o.type = 'triangle';
          o.frequency.value = f;
          const g = ac.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.25, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          o.connect(g);
          g.connect(masterOut);
          o.start(t);
          o.stop(t + 0.4);
        });
      } catch (e) {}
    }

    /* ================================================================
       CHANGING WORLDS — dusk sky -> starry night -> under the sea.
       The world advances every 30 pops with a slow crossfade.
       ================================================================ */
    const WORLDS = [
      { top: '#243f66', mid: '#3c6b96', bot: '#79a8bb' }, // dusk sky
      { top: '#0d1233', mid: '#1c2a55', bot: '#31456e' }, // starry night
      { top: '#06364e', mid: '#0b5d75', bot: '#12808d' }  // under the sea
    ];
    let worldIdx = 0, worldPrev = 0, worldFade = 1;
    let glowW = 0;   // how "night" we are — bubbles glow at night
    let frameT = 0;

    function advanceWorld() {
      worldPrev = worldIdx;
      worldIdx = (worldIdx + 1) % WORLDS.length;
      worldFade = 0;
    }
    function worldW(i) {
      return worldIdx === i ? worldFade : (worldPrev === i ? 1 - worldFade : 0);
    }
    function hexToRgb(hx) {
      const n = parseInt(hx.slice(1), 16);
      return [n >> 16 & 255, n >> 8 & 255, n & 255];
    }
    function lerpColor(a, b, t) {
      const A = hexToRgb(a), B = hexToRgb(b);
      return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' +
                      Math.round(A[1] + (B[1] - A[1]) * t) + ',' +
                      Math.round(A[2] + (B[2] - A[2]) * t) + ')';
    }

    // night: stars (normalized coords so resize is safe) + crescent moon
    const stars = [];
    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random(), y: Math.random() * 0.85,
        r: 0.6 + Math.random() * 1.5,
        ph: Math.random() * Math.PI * 2,
        sp: 0.02 + Math.random() * 0.05
      });
    }
    const moonSprite = (() => {
      const s = 150, c = document.createElement('canvas');
      c.width = s; c.height = s;
      const g = c.getContext('2d');
      g.fillStyle = '#f2edc9';
      g.beginPath(); g.arc(s / 2, s / 2, 36, 0, Math.PI * 2); g.fill();
      g.globalCompositeOperation = 'destination-out';
      g.beginPath(); g.arc(s / 2 + 16, s / 2 - 9, 31, 0, Math.PI * 2); g.fill();
      g.globalCompositeOperation = 'destination-over';
      const glow = g.createRadialGradient(s / 2, s / 2, 20, s / 2, s / 2, s / 2);
      glow.addColorStop(0, 'rgba(240,240,215,0.45)');
      glow.addColorStop(1, 'rgba(240,240,215,0)');
      g.fillStyle = glow; g.fillRect(0, 0, s, s);
      return c;
    })();

    // sea: background fish (they face left; flipped when swimming right)
    const FISH_EMOJI = ['🐠', '🐟', '🐡', '🐙', '🦑'];
    const seaFish = [];
    for (let i = 0; i < 5; i++) {
      seaFish.push({
        e: FISH_EMOJI[i % FISH_EMOJI.length],
        x: Math.random() * 800,
        yR: 0.15 + Math.random() * 0.7,
        dir: Math.random() < 0.5 ? -1 : 1,
        sp: 0.5 + Math.random() * 0.7,
        ph: Math.random() * Math.PI * 2,
        size: 26 + Math.random() * 16
      });
    }

    /* ================================================================
       CLOUDS + SUN
       ================================================================ */
    function makeCloudSprite(scale) {
      const w = 260 * scale, h = 110 * scale;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      const blobs = [
        [0.30, 0.62, 0.30], [0.50, 0.45, 0.36], [0.70, 0.60, 0.28],
        [0.42, 0.70, 0.26], [0.60, 0.72, 0.24]
      ];
      blobs.forEach(([bx, by, br]) => {
        const r = br * h;
        const rg = g.createRadialGradient(bx * w, by * h, r * 0.2, bx * w, by * h, r);
        rg.addColorStop(0, 'rgba(255,255,255,0.95)');
        rg.addColorStop(0.7, 'rgba(255,255,255,0.55)');
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = rg;
        g.beginPath();
        g.arc(bx * w, by * h, r, 0, Math.PI * 2);
        g.fill();
      });
      return c;
    }
    const clouds = [];
    for (let i = 0; i < 4; i++) {
      const s = 0.7 + Math.random() * 0.9;
      clouds.push({
        sprite: makeCloudSprite(s),
        x: Math.random() * W,
        y: H * (0.05 + Math.random() * 0.35),
        v: 0.08 + Math.random() * 0.12,
        alpha: 0.22 + Math.random() * 0.2
      });
    }

    function drawBackground() {
      frameT++;
      if (worldFade < 1) worldFade = Math.min(1, worldFade + 0.006);
      const a = WORLDS[worldPrev], b = WORLDS[worldIdx];
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0,    lerpColor(a.top, b.top, worldFade));
      g.addColorStop(0.55, lerpColor(a.mid, b.mid, worldFade));
      g.addColorStop(1,    lerpColor(a.bot, b.bot, worldFade));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      const duskW = worldW(0), nightW = worldW(1), seaW = worldW(2);
      glowW = nightW;

      if (duskW > 0.01) {
        const sun = ctx.createRadialGradient(W * 0.14, H * 0.12, 10, W * 0.14, H * 0.12, Math.min(W, H) * 0.38);
        sun.addColorStop(0, 'rgba(255,225,150,0.55)');
        sun.addColorStop(0.25, 'rgba(255,210,140,0.20)');
        sun.addColorStop(1, 'rgba(255,210,140,0)');
        ctx.globalAlpha = duskW;
        ctx.fillStyle = sun;
        ctx.fillRect(0, 0, W, H);
        clouds.forEach(cl => {
          cl.x += cl.v;
          if (cl.x - cl.sprite.width > W) cl.x = -cl.sprite.width;
          ctx.globalAlpha = cl.alpha * duskW;
          ctx.drawImage(cl.sprite, cl.x - cl.sprite.width / 2, cl.y - cl.sprite.height / 2);
        });
        ctx.globalAlpha = 1;
      }

      if (nightW > 0.01) {
        ctx.globalAlpha = nightW;
        ctx.drawImage(moonSprite, W * 0.14 - 75, H * 0.12 - 75);
        ctx.fillStyle = '#eaf2ff';
        for (const s of stars) {
          const tw = 0.3 + 0.7 * Math.max(0, Math.sin(frameT * s.sp + s.ph));
          ctx.globalAlpha = nightW * tw;
          ctx.beginPath();
          ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      if (seaW > 0.01) {
        // swaying light rays from the surface
        for (let i = 0; i < 3; i++) {
          ctx.save();
          ctx.translate(W * (0.2 + i * 0.3), -40);
          ctx.rotate(0.18 * (i - 1) + Math.sin(frameT * 0.004 + i * 2) * 0.05);
          const w = 60 + i * 30;
          // soft-edged beam: horizontal gradient peaking in the middle
          const ray = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
          ray.addColorStop(0, 'rgba(190,240,255,0)');
          ray.addColorStop(0.5, 'rgba(190,240,255,' + (0.13 * seaW) + ')');
          ray.addColorStop(1, 'rgba(190,240,255,0)');
          ctx.fillStyle = ray;
          ctx.fillRect(-w / 2, 0, w, H * 0.95);
          ctx.restore();
        }
        // background fish
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const f of seaFish) {
          f.x += f.dir * f.sp * seaW;
          if (f.x < -60) { f.x = W + 60; }
          if (f.x > W + 60) { f.x = -60; }
          const fy = f.yR * H + Math.sin(frameT * 0.02 + f.ph) * 12;
          ctx.save();
          ctx.translate(f.x, fy);
          if (f.dir > 0) ctx.scale(-1, 1);
          ctx.globalAlpha = 0.5 * seaW;
          ctx.font = f.size + 'px sans-serif';
          ctx.fillText(f.e, 0, 0);
          ctx.restore();
        }
      }
    }

    /* ================================================================
       BUBBLES — iridescent soap-film look
       ================================================================ */
    // surprise passengers: pop their bubble and they escape with a sound
    const ANIMALS = [
      { e: '🦆', move: 'flutter', snd: 'quack' },
      { e: '🐦', move: 'flutter', snd: 'chirp' },
      { e: '🦋', move: 'flutter', snd: 'chirp' },
      { e: '🐝', move: 'flutter', snd: 'chirp' },
      { e: '🐟', move: 'swim',    snd: 'blub'  },
      { e: '🐠', move: 'swim',    snd: 'blub'  },
      { e: '🐸', move: 'hop',     snd: 'boing' },
      { e: '🐰', move: 'hop',     snd: 'boing' }
    ];

    const BUBBLE_HUES = [340, 200, 265, 130, 40, 300, 180, 15, 220, 90];
    let bubbles = [];
    let popFX = [];
    let score = 0;

    class Bubble {
      constructor(initial) { this.reset(initial); }

      reset(initial = false) {
        this.r = 34 + Math.random() * 52;
        this.x = this.r + Math.random() * Math.max(1, W - this.r * 2);
        this.y = initial ? Math.random() * H : H + this.r + 10 + Math.random() * 60;
        this.vy = -(0.46 + Math.random() * 0.78);
        this.wind = (Math.random() - 0.5) * 0.46;
        this.phase = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.012 + Math.random() * 0.014;
        this.wobbleAmp = 0.35 + Math.random() * 0.5;
        this.hue = BUBBLE_HUES[Math.floor(Math.random() * BUBBLE_HUES.length)];
        this.shimmer = Math.random() * 360;
        this.spin = Math.random() * Math.PI * 2;
        this.spinV = (Math.random() - 0.5) * 0.01;
        this.animal = Math.random() < 0.22
          ? ANIMALS[Math.floor(Math.random() * ANIMALS.length)]
          : null;
        this.alive = true;
        this.birth = performance.now();
      }

      update() {
        this.phase += this.wobbleSpeed;
        this.x += Math.sin(this.phase) * this.wobbleAmp + this.wind;
        this.y += this.vy;
        this.shimmer = (this.shimmer + 0.6) % 360;
        this.spin += this.spinV;
        if (this.y + this.r < -20) this.reset();
        if (this.x + this.r < -30) this.x = W + this.r;
        if (this.x - this.r > W + 30) this.x = -this.r;
      }

      draw() {
        const r = this.r;
        const h = this.hue;
        const sq = 1 + Math.sin(this.phase * 2.3) * 0.035; // gentle jelly wobble
        // pop-in scale for freshly (re)spawned bubbles
        const age = (performance.now() - this.birth) / 400;
        const grow = age < 1 ? 0.4 + 0.6 * (1 - Math.pow(1 - age, 3)) : 1;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(grow / sq, grow * sq);

        // at night the bubbles glow softly
        if (glowW > 0.02) {
          const gl = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r * 1.45);
          gl.addColorStop(0, `hsla(${h},90%,72%,0)`);
          gl.addColorStop(0.55, `hsla(${h},90%,72%,${0.20 * glowW})`);
          gl.addColorStop(1, `hsla(${h},90%,72%,0)`);
          ctx.fillStyle = gl;
          ctx.beginPath();
          ctx.arc(0, 0, r * 1.45, 0, Math.PI * 2);
          ctx.fill();
        }

        // thin-film body: near-transparent middle, tinted colored rim
        const body = ctx.createRadialGradient(0, 0, r * 0.35, 0, 0, r);
        body.addColorStop(0,    `hsla(${h},70%,96%,0.05)`);
        body.addColorStop(0.72, `hsla(${h},65%,85%,0.10)`);
        body.addColorStop(0.90, `hsla(${h},80%,68%,0.38)`);
        body.addColorStop(1,    `hsla(${h},85%,55%,0.55)`);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = body;
        ctx.fill();

        // iridescent rainbow film on the rim — three hue-shifted arcs
        // slowly rotating around the bubble
        ctx.lineWidth = r * 0.14;
        ctx.lineCap = 'round';
        for (let i = 0; i < 3; i++) {
          const a0 = this.spin + this.shimmer * 0.01 + i * (Math.PI * 2 / 3);
          const arcHue = (h + this.shimmer + i * 110) % 360;
          ctx.strokeStyle = `hsla(${arcHue},95%,70%,0.30)`;
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.90, a0, a0 + 1.9);
          ctx.stroke();
        }

        // surprise animal riding inside, gently bobbing
        if (this.animal) {
          const bob = Math.sin(this.phase * 1.6) * r * 0.06;
          ctx.font = Math.round(r * 0.9) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.globalAlpha = 0.95;
          ctx.fillText(this.animal.e, 0, bob + r * 0.03);
          ctx.globalAlpha = 1;
        }

        // crisp outer edge
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.985, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${(h + 30) % 360},90%,80%,0.5)`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // big soft window-light highlight, top-left
        ctx.save();
        ctx.translate(-r * 0.34, -r * 0.40);
        ctx.rotate(-0.65);
        const hl = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.38);
        hl.addColorStop(0, 'rgba(255,255,255,0.9)');
        hl.addColorStop(0.5, 'rgba(255,255,255,0.35)');
        hl.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = hl;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.36, r * 0.20, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // small counter-highlight, bottom-right
        const hl2 = ctx.createRadialGradient(r * 0.42, r * 0.45, 0, r * 0.42, r * 0.45, r * 0.16);
        hl2.addColorStop(0, 'rgba(255,255,255,0.55)');
        hl2.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = hl2;
        ctx.beginPath();
        ctx.arc(r * 0.42, r * 0.45, r * 0.16, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    /* ================================================================
       POP EFFECTS
       ================================================================ */
    function spawnPopFX(x, y, r, hue) {
      popFX.push({ type: 'ring', x, y, r: r * 0.6, maxR: r * 2.2, hue, alpha: 0.95, lw: Math.max(2.5, r * 0.09) });
      popFX.push({ type: 'flash', x, y, r: r * 0.9, alpha: 0.7 });
      const drops = 10 + Math.floor(r / 7);
      for (let i = 0; i < drops; i++) {
        const a = (Math.PI * 2 * i / drops) + Math.random() * 0.5;
        const sp = 2 + Math.random() * 4.5;
        popFX.push({
          type: 'drop', x: x + Math.cos(a) * r * 0.7, y: y + Math.sin(a) * r * 0.7,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
          r: 2 + Math.random() * 4,
          hue: (hue + Math.random() * 50 - 25 + 360) % 360,
          alpha: 1, decay: 0.035 + Math.random() * 0.035
        });
      }
      for (let i = 0; i < 5; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 2.5;
        popFX.push({
          type: 'sparkle', x, y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 2 + Math.random() * 2.5,
          hue: (hue + 60) % 360,
          alpha: 1, decay: 0.03 + Math.random() * 0.03
        });
      }
    }

    function releaseAnimal(b) {
      const dir = b.x < W / 2 ? 1 : -1;
      popFX.push({
        type: 'animal', move: b.animal.move, char: b.animal.e,
        x: b.x, y: b.y, dir,
        vx: dir * 1.8, vy: -5, t: 0,
        angle: 0, rot: (Math.random() - 0.5) * 0.06,
        size: Math.max(30, Math.round(b.r * 0.9)), alpha: 1
      });
    }

    function spawnConfetti() {
      const emojis = ['🎉', '⭐', '🫧', '💛', '🌈', '✨'];
      for (let i = 0; i < 16; i++) {
        popFX.push({
          type: 'emoji',
          char: emojis[Math.floor(Math.random() * emojis.length)],
          x: W * (0.15 + Math.random() * 0.7),
          y: H * (0.25 + Math.random() * 0.3),
          vx: (Math.random() - 0.5) * 4,
          vy: -2 - Math.random() * 4,
          size: 22 + Math.random() * 22,
          rot: (Math.random() - 0.5) * 0.2,
          angle: (Math.random() - 0.5) * 0.8,
          alpha: 1, decay: 0.008 + Math.random() * 0.006
        });
      }
    }

    function updateDrawFX() {
      for (let i = popFX.length - 1; i >= 0; i--) {
        const p = popFX[i];
        if (p.type === 'ring') {
          p.r += (p.maxR - p.r) * 0.20;
          p.alpha -= 0.07;
          if (p.alpha <= 0) { popFX.splice(i, 1); continue; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${p.hue},85%,60%,${p.alpha})`;
          ctx.lineWidth = p.lw * p.alpha;
          ctx.stroke();
        } else if (p.type === 'flash') {
          p.r *= 1.14;
          p.alpha -= 0.11;
          if (p.alpha <= 0) { popFX.splice(i, 1); continue; }
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
          g.addColorStop(0, `rgba(255,255,255,${p.alpha})`);
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === 'drop') {
          p.x += p.vx; p.y += p.vy;
          p.vy += 0.16; p.vx *= 0.98;
          p.alpha -= p.decay;
          if (p.alpha <= 0) { popFX.splice(i, 1); continue; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.hue},75%,60%,${p.alpha * 0.85})`;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${p.alpha * 0.8})`;
          ctx.fill();
        } else if (p.type === 'sparkle') {
          p.x += p.vx; p.y += p.vy;
          p.vx *= 0.94; p.vy *= 0.94;
          p.alpha -= p.decay;
          if (p.alpha <= 0) { popFX.splice(i, 1); continue; }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.fillStyle = `hsla(${p.hue},100%,75%,${p.alpha})`;
          ctx.beginPath();
          for (let s = 0; s < 4; s++) {
            const a = s * Math.PI / 2;
            const a2 = a + Math.PI / 4;
            if (s === 0) ctx.moveTo(Math.cos(a) * p.r * 2, Math.sin(a) * p.r * 2);
            else ctx.lineTo(Math.cos(a) * p.r * 2, Math.sin(a) * p.r * 2);
            ctx.lineTo(Math.cos(a2) * p.r * 0.5, Math.sin(a2) * p.r * 0.5);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        } else if (p.type === 'animal') {
          p.t++;
          if (p.move === 'flutter') {
            p.y -= 2.0;
            p.x += Math.sin(p.t * 0.16) * 2.4;
            p.angle = Math.sin(p.t * 0.16) * 0.22;
          } else if (p.move === 'swim') {
            p.x += p.dir * 2.8;
            p.y += Math.sin(p.t * 0.12) * 1.5;
            p.angle = Math.sin(p.t * 0.12) * 0.12 * p.dir;
          } else { // hop
            p.vy += 0.13;
            p.x += p.vx;
            p.y += p.vy;
            p.angle += p.rot;
          }
          if (p.t > 70) p.alpha -= 0.02;
          if (p.alpha <= 0 || p.y < -90 || p.y > H + 90 || p.x < -90 || p.x > W + 90) {
            popFX.splice(i, 1); continue;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          // emoji animals face left; flip when heading right
          if (p.move === 'swim' && p.dir > 0) ctx.scale(-1, 1);
          ctx.globalAlpha = Math.min(1, p.alpha);
          ctx.font = p.size + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.char, 0, 0);
          ctx.restore();
        } else if (p.type === 'emoji') {
          p.x += p.vx; p.y += p.vy;
          p.vy += 0.08;
          p.angle += p.rot;
          p.alpha -= p.decay;
          if (p.alpha <= 0 || p.y > H + 60) { popFX.splice(i, 1); continue; }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.globalAlpha = Math.min(1, p.alpha);
          ctx.font = p.size + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.char, 0, 0);
          ctx.restore();
        }
      }
    }

    /* ================================================================
       GAME
       ================================================================ */
    const NUM_BUBBLES = Math.max(9, Math.min(16, Math.floor(W * H / 32000)));
    for (let i = 0; i < NUM_BUBBLES; i++) bubbles.push(new Bubble(true));

    const CHEERS = ['YAY ZAYN! 🎉', 'WOW! ⭐', 'SUPER POPPING! 🫧', 'AMAZING! 🌈', 'GREAT JOB ZAYN! 💛'];
    function celebrate() {
      cheerEl.textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
      cheerEl.classList.add('show');
      setTimeout(() => cheerEl.classList.remove('show'), 1600);
      spawnConfetti();
      playCheer();
    }

    function tryPop(px, py) {
      // forgiving hit test for little fingers: pop the nearest bubble
      // whose (slightly padded) circle contains the touch
      let best = null, bestD = Infinity;
      for (const b of bubbles) {
        if (!b.alive) continue;
        const dx = px - b.x, dy = py - b.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d <= b.r + 22 && d < bestD) { best = b; bestD = d; }
      }
      if (!best) return;

      best.alive = false;
      playPop(best.r);
      spawnPopFX(best.x, best.y, best.r, best.hue);
      if (best.animal) {
        releaseAnimal(best);
        playAnimalSound(best.animal.snd);
      }

      score++;
      if (score % 30 === 0) advanceWorld();
      scoreEl.textContent = '🫧 ' + score;
      scoreEl.style.transform = 'scale(1.3)';
      setTimeout(() => { scoreEl.style.transform = 'scale(1)'; }, 110);
      if (score === 1) {
        // the pulse keyframe animation would override inline opacity
        hintEl.style.animation = 'none';
        hintEl.style.opacity = '0';
      }
      if (score % 10 === 0) celebrate();

      setTimeout(() => { best.reset(); }, 500 + Math.random() * 900);
    }

    // pointerdown fires once per finger — multi-touch popping works
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      tryPop(e.clientX, e.clientY);
    });
    // block iOS double-tap zoom / pinch / scroll
    document.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());

    // test hook: jump straight to a world (0 sky, 1 night, 2 sea)
    window.__world = i => { worldPrev = worldIdx = i % WORLDS.length; worldFade = 1; };

    function frame() {
      drawBackground();
      for (const b of bubbles) {
        if (b.alive) { b.update(); b.draw(); }
      }
      updateDrawFX();
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
